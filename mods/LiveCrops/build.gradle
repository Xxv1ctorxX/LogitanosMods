plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def modVersion = project.version.toString()
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand version: modVersion }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('verifyCore', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.livecrops.CoreTests'
    enableAssertions = true
}
check.dependsOn verifyCore
tasks.named('test') {
    dependsOn verifyCore
    enabled = false // verifyCore ejecuta las pruebas sin descargar un framework.
}

jar { from 'LICENSE' }

tasks.register('collectJar', Copy) {
    dependsOn jar, check
    from tasks.jar
    into rootProject.file('../../jar/LiveCrops')
}
