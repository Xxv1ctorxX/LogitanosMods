plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
loom {
    splitEnvironmentSourceSets()
    mods { ludopathyroulette { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources {
    def modVersion = project.version.toString()
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand version: modVersion }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
jar { from 'LICENSE' }
tasks.register('verifyCore', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.ludopathyroulette.CoreTests'
    enableAssertions = true
    workingDir = projectDir
}
tasks.named('test') { enabled = false; dependsOn verifyCore }
check.dependsOn verifyCore
tasks.register('verifyPackage', JavaExec) {
    dependsOn jar, testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.ludopathyroulette.PackageTests'
    args layout.buildDirectory.file("libs/ludopathyroulette-${project.version}.jar").get().asFile.absolutePath
}
check.dependsOn verifyPackage
tasks.register('collectJar', Copy) {
    dependsOn jar, check
    from tasks.jar
    into rootProject.file('../../jar/LudopathyRoulette')
}
