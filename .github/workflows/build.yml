name: Build

# Compila cada mod en la nube (Java 25) y publica el .jar como artefacto descargable.
# Para sacar una versión de un mod, crea un tag con su nombre:
#   git tag theball-v1.0.0 && git push --tags
on:
  push:
    branches: [main, master]
    tags: ['*-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  theball:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mods/TheBall
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mods/TheBall

      - name: Build
        run: ./gradlew build

      - name: Subir el .jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: theball-jar
          path: |
            mods/TheBall/build/libs/*.jar
            !mods/TheBall/build/libs/*-sources.jar

      - name: Publicar release (solo con tag theball-v*)
        if: startsWith(github.ref, 'refs/tags/theball-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mods/TheBall/build/libs/*.jar
            !mods/TheBall/build/libs/*-sources.jar
